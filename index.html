<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Extract Chunks Script README</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/2.1.3/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/highlight.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/styles/atom-one-dark.min.css"
        />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap");

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Inter", sans-serif;
                background-color: #1e1e1e;
                color: #e0e0e0;
                display: flex;
                height: 100vh;
                overflow: hidden;
            }

            #markdown-content {
                flex-grow: 1;
                padding: 30px;
                overflow-y: auto;
            }

            #content {
                max-width: 800px;
                margin: 0 auto;
                line-height: 1.6;
            }

            #content h1,
            #content h2,
            #content h3,
            #content h4,
            #content h5,
            #content h6 {
                margin-top: 1.5em;
                margin-bottom: 0.5em;
                color: #61afef;
            }

            #content p {
                margin-bottom: 1em;
            }

            #content code {
                background-color: #2c313a;
                padding: 2px 4px;
                border-radius: 3px;
                font-family: "Consolas", monospace;
            }

            #content pre {
                background-color: #282c34;
                padding: 15px;
                border-radius: 5px;
                overflow-x: auto;
                margin-bottom: 1em;
            }

            #content img {
                max-width: 100%;
                border-radius: 5px;
                margin: 1em 0;
            }

            #content a {
                color: #61afef;
                text-decoration: none;
                border-bottom: 1px solid #61afef;
                transition: all 0.3s ease;
            }

            #content a:hover {
                color: #c678dd;
                border-bottom-color: #c678dd;
            }

            .loading {
                display: none;
                text-align: center;
                padding: 20px;
                font-style: italic;
                color: #888;
            }

            /* Scrollbar Styling */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #1e1e1e;
            }

            ::-webkit-scrollbar-thumb {
                background: #888;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #555;
            }
        </style>
    </head>
    <body>
        <div id="markdown-content">
            <div id="content"></div>
        </div>

        <script>
            const markdownFiles = ['README.md'];
            const markdownContent = document.getElementById("content");

            // Set up marked with syntax highlighting
            marked.setOptions({
                highlight: (code, lang) => {
                    const language = hljs.getLanguage(lang) ? lang : "plaintext";
                    return hljs.highlight(code, { language }).value;
                },
                langPrefix: "hljs language-",
            });

            // Load and render markdown file
            fetch(markdownFiles[0])
                .then((res) => {
                    if (!res.ok) throw new Error(`Failed to load ${markdownFiles[0]}`);
                    return res.text();
                })
                .then((text) => {
                    // Append additional links to markdown content
                    const additionalLinks = `


                    
## Related Documents


- [Extracted Chunks (All proposal Docs)](/Proposal_Documents/index.html)


- [Extracted Chunks (All learning and background work Docs)](/Learning_And_Background_Work/index.html)
`;
                    text += additionalLinks;
                    markdownContent.innerHTML = marked(text);
                })
                .catch((err) => {
                    console.error(err);
                    markdownContent.innerHTML = `<p>Error loading README: ${err.message}</p>`;
                });
        </script>
    </body>
</html>
